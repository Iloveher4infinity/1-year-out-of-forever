<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Our Private Daze Space 💌✨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Caveat:wght@700&family=Comfortaa:wght@700&family=Dancing+Script:wght@700&family=Fredoka:wght@600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #ffe6f2 0%, #ffd6eb 45%, #e8d5ff 100%);
      font-family: 'Quicksand', sans-serif;
      position: relative;
      transition: background 0.5s ease;
    }

    #canvas-bg {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(233, 30, 99, 0.16) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      z-index: 1;
      pointer-events: none;
    }

    /* Smooth Doodle Canvas */
    #draw-canvas {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      touch-action: none;
    }
    #draw-canvas.drawing-active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 50;
      display: flex;
      gap: 5px;
      align-items: center;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      padding: 6px 8px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(216, 27, 96, 0.18);
      border: 1.5px solid #fff;
    }

    .yt-input {
      flex: 1;
      border: none;
      background: #fff0f6;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      color: #ad1457;
      outline: none;
      min-width: 0;
    }

    .music-badge {
      display: none;
      font-size: 11px;
      font-weight: 800;
      color: #ff1e7a;
      background: #ffe4f0;
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
      animation: pulseMusic 1.5s infinite alternate;
    }
    @keyframes pulseMusic {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.04); }
    }

    .icon-btn {
      border: none;
      background: #ff2e82;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(255, 46, 130, 0.3);
    }
    .icon-btn:active { transform: scale(0.9); }

    .ring-btn {
      background: linear-gradient(135deg, #ff7eb3, #ff2e82);
      animation: pulseRing 2s infinite;
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Hidden Background YouTube Player */
    #yt-player-wrap {
      position: fixed;
      width: 1px;
      height: 1px;
      top: -100px;
      left: -100px;
      opacity: 0.01;
      pointer-events: none;
      overflow: hidden;
    }

    /* Scrollable Daze Scrapbook Feed */
    #scrapbook-layer {
      position: fixed;
      top: 58px;
      bottom: 105px;
      left: 0;
      right: 0;
      z-index: 15;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 16px 70px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      -webkit-overflow-scrolling: touch;
    }

    .daze-slot {
      width: 100%;
      display: flex;
      position: relative;
      min-height: 38px;
      flex-shrink: 0;
    }

    /* Freeform Draggable Text & Sticker */
    .daze-item {
      position: relative;
      cursor: grab;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 4px 6px;
      max-width: 78%;
      line-height: 1.2;
      word-wrap: break-word;
      filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.98)) drop-shadow(0 3px 10px rgba(216, 27, 96, 0.14));
      touch-action: none;
      z-index: 16;
    }
